<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#1a1a2e"/>
  
  <!-- Movie ticket shape -->
  <rect x="20" y="30" width="88" height="68" rx="4" fill="#e94560" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Ticket perforations -->
  <circle cx="25" cy="64" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="103" cy="64" r="3" fill="#ffffff" opacity="0.7"/>
  
  <!-- Text -->
  <text x="64" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">TICKET</text>
</svg>
