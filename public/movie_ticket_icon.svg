<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- background circle -->
  <circle cx="60" cy="60" r="60" fill="#1a1a2e" />

  <!-- clapboard rectangle -->
  <rect x="20" y="35" width="80" height="50" rx="4" ry="4" fill="#e94560" />
  <!-- clapboard stripes -->
  <path d="M20 35 L100 35 L100 45 L20 45 Z" fill="#000" />
  <path d="M20 40 L100 40" stroke="#fff" stroke-width="2" />
  <path d="M20 45 L100 45" stroke="#fff" stroke-width="2" />

  <!-- film reel circles -->
  <circle cx="35" cy="60" r="7" fill="#000" />
  <circle cx="35" cy="60" r="3" fill="#fff" />
  <circle cx="45" cy="60" r="7" fill="#000" />
  <circle cx="45" cy="60" r="3" fill="#fff" />

  <!-- movie text -->
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">MOVIE</text>
</svg>